name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: make build

      - name: test
        run: make test

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
