# rrev default configuration.
# Format: INI-style `key = value`. Inline comments are not supported, so a `#`
# inside a value is part of the value.

# Primary executor driving the review phases and the fixes: claude or codex.
executor = claude
claude_command = claude
codex_command = codex

# Independent second opinion for the external review loop: codex, custom, none.
external_review_tool = codex
external_review_command =

# Empty base_ref means the repository's default branch is detected at startup.
base_ref =

# Model specifications use the combined `model[:effort]` form; an omitted part
# inherits from `model`, and an omitted `model` leaves the tool's own default.
model =
review_model =
external_model =
final_model =
finalize_model =

max_iterations = 10
external_max_iterations = 5
final_max_iterations = 5

# Consecutive unchanged iterations tolerated before a loop gives up; 0 disables.
stalemate_patience = 0

# Executor bounds; 0 disables. idle_timeout expires only without output.
session_timeout = 0
idle_timeout = 0

# How often to report that a silent executor is still working.
progress_interval = 30s

finalize = false

progress_dir = .rrev/progress
report_file = .rrev/findings.md

# Maximum characters of requirement checklist expanded into a prompt.
checklist_budget = 20000

# Commands the executor runs before committing a fix; empty lets the prompt
# fall back to whatever the project's own conventions are.
validation_command =

debug = false
no_color = false
